<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <section class="header-content">
        <div class="header-logo-box">
          <ion-icon name="sunny" class="header-logo"></ion-icon>
        </div>
        <div class="header-text-box">
          <h1 class="header-heading">Weather</h1>
          <p class="header-subheading">
            Real-time Forecast & Atmospheric Intelligence
          </p>
        </div>
      </section>
      <section class="status-bar">
        <div class="status-dot online"></div>
        <p class="status-text">Live Monitoring Active</p>
      </section>
    </header>
    <main class="main">
      <section class="search">
        <section class="search-header">
          <ion-icon name="search" class="search-logo"></ion-icon>
          <h2 class="search-heading">Search Location</h2>
        </section>

        <section class="search-box">
          <input
            type="text"
            class="search-input"
            placeholder="Enter city or zip code"
          />
          <button class="search-button">Get Weather</button>
        </section>
        <section class="popular-searches">
          <h3 class="popular-searches-heading">Popular:</h3>
          <ul class="popular-searches-list">
            <li class="popular-search-item">
              <a href="#" class="popular-search-link">New York</a>
            </li>
            <li class="popular-search-item">
              <a href="#" class="popular-search-link">Los Angeles</a>
            </li>
            <li class="popular-search-item">
              <a href="#" class="popular-search-link">Chicago</a>
            </li>
            <li class="popular-search-item">
              <a href="#" class="popular-search-link">Houston</a>
            </li>
            <li class="popular-search-item">
              <a href="#" class="popular-search-link">Miami</a>
            </li>
          </ul>
        </section>
      </section>
      <section class="results">result</section>
      <section class="recent-searches">recent searches</section>
    </main>
    <footer class="footer">
      <p>© 2026 Weather App</p>
    </footer>

    <script
      type="module"
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"
    ></script>
  </body>
</html>
